# One file for all four conveyor nodes, so they always agree on the geometry.
/**:
  ros__parameters:
    # --- shared geometry (all nodes) ---
    frame_id: world          # must be the MoveIt planning frame
    belt_height: 0.40        # top surface height (m)
    belt_y: -0.60            # belt centerline y (m)
    belt_width: 0.40
    start_x: -0.80           # where boxes appear
    pick_x: 0.0              # where the lead box stops
    box_size: [0.10, 0.10, 0.10]   # x, y, z (m)
    gap: 0.05                # spacing between queued boxes
    

    # --- box_advancer ---
    speed: 0.5              # m/s
    rate: 150.0               # Hz

    # --- conveyor_manager ---
    num_boxes: 5             # boxes kept on the belt (max = slots between start_x and pick_x)
    max_boxes: 50            # total boxes for the whole simulation
    manager_rate: 150.0       # Hz

    # --- proximity_sensor ---
    clear_dist: 0.08         # box counts as removed once this far from the pick point (m)
    debounce_cycles: 3       # consecutive "clear" readings required
    sensor_rate: 20.0        # Hz
