controller_manager:
  ros__parameters:
    update_rate: 100
    fairino5_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    test_rail_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller2:
      type: joint_trajectory_controller/JointTrajectoryController

      
fairino5_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position

test_rail_controller:
  ros__parameters:
    joints:
      - test_rail_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint_X
    command_interfaces:
      - position
    state_interfaces:
      - position

# thic controller only works if you have the joint_X2
gripper_controller2:
  ros__parameters:
    joints:
      - gripper_joint_X
      - gripper_joint_X2
    command_interfaces:
      - position
    state_interfaces:
      - position
    


joint_state_broadcaster:
  ros__parameters: {}