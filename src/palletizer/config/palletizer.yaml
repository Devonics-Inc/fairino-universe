# Everything about the PALLET lives in pallet_planner.
pallet_planner:
  ros__parameters:
    frame_id: world
    pallet_top: [0.0, 0.6, 0.15]     # x, y, z of the pallet's top-surface center
    pallet_size: [0.8, 0.6, 0.15]
    box_size: [0.2, 0.2, 0.2]        # CHECK: must match the conveyor's box_size
    gap: 0.01                        # between neighbouring boxes
    layers: 2                        # pattern is fixed at 2 x 2 per layer
    place_yaw: 0.0                   # box yaw on the pallet (rad)
    pose_timeout: 0.5                # pick pose older than this is ignored (s)
    spawn_pallet: true

# Everything about the ROBOT and TOOL lives in the executor.
palletizer:
  ros__parameters:
    planning_group: fairino5_v6_group   # CHECK: SRDF group
    ee_link: wrist3_link                # CHECK: link the box attaches to
    tool_length: 0.10                   # CHECK: ee_link origin -> tool/flange face (m)
    grasp_clearance: 0.005              # gap between tool face and box top at attach (m)
    grasp_rpy: [3.14159, 0.0, 0.0]      # tool pointing down
    approach_height: 0.10
    velocity_scaling: 0.3
    acceleration_scaling: 0.3